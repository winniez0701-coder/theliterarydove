<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head>
<body><div class="top"><div class="wrap flex"><span>Independent Student Journalism</span><span id="today"></span></div></div><header class="wrap masthead"><a href="{{ '/' | relative_url }}"><h1>The Literary Dove</h1></a><p>Where Words Take Flight</p></header><nav class="wrap nav"><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/#School-News' | relative_url }}">School News</a><a href="{{ '/#Opinion' | relative_url }}">Opinion</a><a href="{{ '/#Literature' | relative_url }}">Literature</a><a href="{{ '/#Arts-and-Culture' | relative_url }}">Arts &amp; Culture</a><a href="{{ '/#Science' | relative_url }}">Science</a><a href="{{ '/#Interviews' | relative_url }}">Interviews</a></nav><main class="wrap">{{ content }}</main><footer class="wrap"><strong>The Literary Dove</strong> · Student-led journalism · © <span id="year"></span></footer><script>document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});document.getElementById('year').textContent=new Date().getFullYear();</script></body></html>
